<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register | Anshu Kirana Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg main-navbar py-2">
    <div class="container">
      <a class="navbar-brand d-flex flex-column" href="/index.html">
        <span class="brand-logo d-flex align-items-center gap-2">
          <i class="bi bi-basket2-fill text-success"></i>
          <span data-i18n="appName">Anshu Kirana Store</span>
        </span>
        <span class="brand-tagline" data-i18n="tagline">Fresh Groceries at Your Village Doorstep</span>
      </a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/index.html" class="btn btn-outline-secondary btn-sm" data-i18n="home">
          <i class="bi bi-arrow-left me-1"></i> Home
        </a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow rounded-4 overflow-hidden bg-white">
          <!-- Auth Tabs -->
          <ul class="nav nav-tabs nav-fill bg-light border-bottom" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-bold py-3" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab" data-i18n="login">
                Customer / Admin Login
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-bold py-3" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab" data-i18n="register">
                New Registration
              </button>
            </li>
          </ul>

          <div class="tab-content p-4 p-md-5" id="authTabsContent">
            <!-- Login Form -->
            <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
              <form id="login-form" onsubmit="handleLoginSubmit(event)">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Mobile Number or Email</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="login-identifier" required placeholder="e.g. 9876543211 or admin@anshukirana.com">
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
                  </div>
                </div>

                <button type="submit" id="login-submit-btn" class="btn btn-primary-kirana w-100 py-2 fw-bold mt-2">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
              </form>

              <!-- Quick Demo Credentials Box for Evaluation -->
              <div class="mt-4 p-3 bg-light rounded-3 border small">
                <div class="fw-bold text-secondary mb-2"><i class="bi bi-info-circle me-1"></i>Quick Test Credentials:</div>
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <span><strong>Store Admin:</strong> 7993542873 / admin123</span>
                  <button type="button" class="btn btn-outline-primary btn-sm py-0 px-2" onclick="fillCredentials('7993542873', 'admin123')">Fill</button>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span><strong>Village Customer:</strong> 9876543211 / customer123</span>
                  <button type="button" class="btn btn-outline-success btn-sm py-0 px-2" onclick="fillCredentials('9876543211', 'customer123')">Fill</button>
                </div>
              </div>
            </div>

            <!-- Registration Form -->
            <div class="tab-pane fade" id="register-panel" role="tabpanel">
              <form id="register-form" onsubmit="handleRegisterSubmit(event)">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Your Full Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="reg-name" required placeholder="e.g. Venkat Rao">
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">10-Digit Mobile Number <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">+91</span>
                    <input type="tel" class="form-control" id="reg-phone" required pattern="[6-9][0-9]{9}" maxlength="10" placeholder="9876543211">
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">Email Address (Optional)</label>
                  <input type="email" class="form-control" id="reg-email" placeholder="customer@village.com">
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">Create Password (min 6 characters) <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="reg-password" required minlength="6" placeholder="••••••••">
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">Preferred Language</label>
                  <select class="form-select" id="reg-lang">
                    <option value="en">English</option>
                    <option value="te" selected>తెలుగు (Telugu)</option>
                  </select>
                </div>

                <button type="submit" id="register-submit-btn" class="btn btn-primary-kirana w-100 py-2 fw-bold mt-2">
                  <i class="bi bi-person-plus me-1"></i> Create Village Account
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    function fillCredentials(id, pwd) {
      document.getElementById('login-identifier').value = id;
      document.getElementById('login-password').value = pwd;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Logging in...`;

      const id = document.getElementById('login-identifier').value.trim();
      const pwd = document.getElementById('login-password').value;

      try {
        const user = await Auth.login(id, pwd);
        UI.showToast(`Welcome back, ${user.fullName}!`, 'success');

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        setTimeout(() => {
          if (Auth.isAdmin()) {
            window.location.href = '/admin/index.html';
          } else if (redirect === 'checkout') {
            window.location.href = '/checkout.html';
          } else if (redirect === 'orders') {
            window.location.href = '/orders.html';
          } else {
            window.location.href = '/index.html';
          }
        }, 500);
      } catch (err) {
        UI.showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('register-submit-btn');
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating account...`;

      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pwd = document.getElementById('reg-password').value;
      const lang = document.getElementById('reg-lang').value;

      try {
        const user = await Auth.register({
          fullName: name,
          phone: phone,
          email: email || null,
          password: pwd,
          preferredLanguage: lang
        });
        UI.showToast(`Account created! Welcome, ${user.fullName}!`, 'success');

        setTimeout(() => {
          window.location.href = '/index.html';
        }, 600);
      } catch (err) {
        UI.showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }
  </script>
</body>
</html>
