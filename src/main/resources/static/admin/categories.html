<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories | Admin | Anshu Kirana Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="admin-sidebar-container"></aside>

  <main class="admin-main">
    <div class="admin-topbar" id="admin-topbar-container"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h4 class="fw-bold mb-0">Grocery Categories</h4>
        <p class="text-muted small mb-0">Manage bilingual categories, icons, and display ordering</p>
      </div>
      <button class="btn btn-success d-flex align-items-center gap-2" onclick="openNewCategoryModal()">
        <i class="bi bi-plus-lg"></i> Add Category
      </button>
    </div>

    <!-- Table Card -->
    <div class="admin-table-card">
      <div class="table-responsive">
        <table class="table admin-table mb-0">
          <thead>
            <tr>
              <th>Image</th>
              <th>English Name</th>
              <th>Telugu Name</th>
              <th>Slug</th>
              <th>Display Order</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-categories-tbody">
            <tr>
              <td colspan="7" class="text-center py-4 text-muted">Loading categories...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Category Modal -->
  <div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-light">
          <h5 class="modal-title fw-bold" id="category-modal-title">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="category-form" onsubmit="handleSaveCategory(event)">
          <div class="modal-body p-4">
            <input type="hidden" id="edit-cat-id">

            <div class="mb-3">
              <label class="form-label small fw-bold">Name (English) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="cat-name-en" required placeholder="e.g. Rice & Grains">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Name (Telugu) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="cat-name-te" required placeholder="e.g. బియ్యం మరియు ధాన్యాలు">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Slug (URL identifier)</label>
              <input type="text" class="form-control" id="cat-slug" placeholder="e.g. rice-grains (leave blank to auto-generate)">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Image URL</label>
              <input type="url" class="form-control" id="cat-image-url" placeholder="https://images.unsplash.com/...">
            </div>

            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold">Display Order</label>
                <input type="number" class="form-control" id="cat-order" value="1">
              </div>
              <div class="col-md-6 d-flex align-items-center mb-3 pt-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="cat-active" checked>
                  <label class="form-check-label small fw-bold" for="cat-active">Active</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer bg-light">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success btn-sm px-3">Save Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let categoriesList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!AdminApp.checkAdminAuth()) return;

      AdminApp.renderSidebar('categories');
      AdminApp.renderTopbar('Grocery Categories');

      await loadCategories();
    });

    async function loadCategories() {
      const tbody = document.getElementById('admin-categories-tbody');
      try {
        const res = await API.get('/api/admin/categories');
        if (res.success && res.data) {
          categoriesList = res.data;
          renderCategoriesTable();
        }
      } catch (err) {
        if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-danger text-center">Failed to load categories: ${err.message}</td></tr>`;
      }
    }

    function renderCategoriesTable() {
      const tbody = document.getElementById('admin-categories-tbody');
      if (!tbody) return;

      if (categoriesList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No categories found.</td></tr>`;
        return;
      }

      tbody.innerHTML = categoriesList.map(c => `
        <tr>
          <td>
            <img src="${c.imageUrl || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=80'}"
                 alt="" class="rounded-circle border" style="width: 42px; height: 42px; object-fit: cover;">
          </td>
          <td><strong class="text-dark">${c.nameEn}</strong></td>
          <td class="text-secondary">${c.nameTe}</td>
          <td><code class="text-muted">${c.slug}</code></td>
          <td>${c.displayOrder || 0}</td>
          <td>
            ${c.isActive ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditCategoryModal(${c.id})">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${c.id})">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function openNewCategoryModal() {
      document.getElementById('edit-cat-id').value = '';
      document.getElementById('category-modal-title').textContent = 'Add Category';
      document.getElementById('category-form').reset();

      const modal = new bootstrap.Modal(document.getElementById('categoryModal'));
      modal.show();
    }

    function openEditCategoryModal(id) {
      const c = categoriesList.find(item => item.id === id);
      if (!c) return;

      document.getElementById('edit-cat-id').value = c.id;
      document.getElementById('category-modal-title').textContent = `Edit Category: ${c.nameEn}`;
      document.getElementById('cat-name-en').value = c.nameEn;
      document.getElementById('cat-name-te').value = c.nameTe;
      document.getElementById('cat-slug').value = c.slug;
      document.getElementById('cat-image-url').value = c.imageUrl || '';
      document.getElementById('cat-order').value = c.displayOrder || 1;
      document.getElementById('cat-active').checked = !!c.isActive;

      const modal = new bootstrap.Modal(document.getElementById('categoryModal'));
      modal.show();
    }

    async function handleSaveCategory(e) {
      e.preventDefault();

      const editId = document.getElementById('edit-cat-id').value;
      const nameEn = document.getElementById('cat-name-en').value.trim();
      const nameTe = document.getElementById('cat-name-te').value.trim();
      const slug = document.getElementById('cat-slug').value.trim();
      const imageUrl = document.getElementById('cat-image-url').value.trim();
      const displayOrder = Number(document.getElementById('cat-order').value) || 1;
      const isActive = document.getElementById('cat-active').checked;

      const payload = { nameEn, nameTe, slug, imageUrl, displayOrder, isActive };

      try {
        let res;
        if (editId) {
          res = await API.put(`/api/admin/categories/${editId}`, payload);
        } else {
          res = await API.post('/api/admin/categories', payload);
        }

        if (res.success) {
          UI.showToast(editId ? 'Category updated' : 'Category created', 'success');
          const modalEl = document.getElementById('categoryModal');
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
          await loadCategories();
        }
      } catch (err) {
        UI.showToast(err.message, 'error');
      }
    }

    async function deleteCategory(id) {
      if (!confirm('Are you sure you want to delete this category?')) return;
      try {
        const res = await API.delete(`/api/admin/categories/${id}`);
        if (res.success) {
          UI.showToast('Category deleted', 'info');
          await loadCategories();
        }
      } catch (err) {
        UI.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
