<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Anshu Kirana Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <i class="bi bi-truck text-warning me-1"></i>
        <span data-i18n="freeDeliveryMsg">Free delivery on orders above ₹299!</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a href="tel:+917993542873" class="d-none d-sm-inline">+91  79935 42873</a>
        <div class="btn-group btn-group-sm">
          <button type="button" class="btn lang-toggle-btn active" data-lang="en" onclick="I18N.setLanguage('en')">English</button>
          <button type="button" class="btn lang-toggle-btn" data-lang="te" onclick="I18N.setLanguage('te')">తెలుగు</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <nav class="navbar navbar-expand-lg main-navbar py-2">
    <div class="container">
      <a class="navbar-brand d-flex flex-column" href="/index.html">
        <span class="brand-logo d-flex align-items-center gap-2">
          <i class="bi bi-basket2-fill text-success"></i>
          <span data-i18n="appName">Anshu Kirana Store</span>
        </span>
        <span class="brand-tagline" data-i18n="tagline">Fresh Groceries at Your Village Doorstep</span>
      </a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <div id="navbar-auth-section"></div>
      </div>
    </div>
  </nav>

  <!-- Cart Content Area -->
  <div class="container my-5">
    <div class="d-flex align-items-center gap-2 mb-4">
      <i class="bi bi-cart3 fs-3 text-success"></i>
      <h3 class="fw-bold mb-0" data-i18n="myCart">My Grocery Basket</h3>
    </div>

    <!-- Free Delivery Village Progress Bar -->
    <div class="card border-0 shadow-sm rounded-3 p-3 mb-4 bg-light" id="free-delivery-meter-box">
      <!-- Injected by cart-page.js -->
    </div>

    <div class="row g-4" id="cart-layout-container">
      <!-- Injected by cart-page.js (Cart items & Summary) -->
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <div class="mobile-bottom-nav d-lg-none">
    <a href="/index.html" class="mobile-nav-item">
      <i class="bi bi-house-door-fill"></i>
      <span data-i18n="home">Home</span>
    </a>
    <a href="/products.html" class="mobile-nav-item">
      <i class="bi bi-grid-fill"></i>
      <span data-i18n="products">Products</span>
    </a>
    <a href="/cart.html" class="mobile-nav-item active position-relative">
      <i class="bi bi-cart3"></i>
      <span data-i18n="myCart">Cart</span>
      <span class="cart-badge cart-count-badge" style="display: none;">0</span>
    </a>
    <a href="/orders.html" class="mobile-nav-item">
      <i class="bi bi-bag-check-fill"></i>
      <span data-i18n="myOrders">Orders</span>
    </a>
    <a href="/login.html" class="mobile-nav-item">
      <i class="bi bi-person-fill"></i>
      <span data-i18n="login">Account</span>
    </a>
  </div>

  <footer class="main-footer">
    <div class="container text-center small text-muted">
      &copy; 2026 Anshu Kirana Store • Village Grocery Platform • COD Available
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/cart-page.js"></script>
</body>
</html>
