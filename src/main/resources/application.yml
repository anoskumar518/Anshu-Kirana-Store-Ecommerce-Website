server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: anshu-kirana-store
  
  # Default to MySQL profile, but can be switched to 'h2' for local zero-config testing
  profiles:
    active: mysql

  mvc:
    static-path-pattern: /**

  jpa:
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: false

---
# MySQL Profile (Production / Local MySQL Server)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/anshu_kirana_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
# H2 In-Memory Profile (For quick Eclipse development without local MySQL server)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:anshukiranadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
# App Specific Configurations
