  jwt:
    secret: AnshuKiranaStoreSuperSecretKey2026VillageGrocerySecureTokenKeyWithHighEntropy998877
    expiration-ms: 86400000 # 24 hours
  store:
    name: "Anshu Kirana Store"
    tagline: "తాజా సరుకులు మీ ఇంటి వద్దకే | Fresh Groceries at Your Village Doorstep"
    currency: "₹"
    country: "India"
    support-phone: "+91 79935 42873"
